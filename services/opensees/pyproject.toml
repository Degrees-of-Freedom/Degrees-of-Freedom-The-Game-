[project]
name = "dof-opensees"
version = "0.1.0"
description = "OpenSees-backed structural analysis service for Degrees of Freedom: The Game"
readme = "README.md"
# OpenSeesPy publishes binary wheels per Python version; 3.12 is the tested one.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "openseespy>=3.7",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dof_opensees"]

[tool.pytest.ini_options]
testpaths = ["tests"]
