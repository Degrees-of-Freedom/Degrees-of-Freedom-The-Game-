name: Web runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:solver
      - run: npm run build
      - run: npm run test:opensees
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { first: 0, last: 4 }
          - { first: 5, last: 9 }
          - { first: 10, last: 14 }
          - { first: 15, last: 19 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release
        env:
          DOF_SOFTWARE_GL: '1'
          DOF_EVIDENCE_DIR: release-evidence
          DOF_FIRST_SEED: ${{ matrix.first }}
          DOF_LAST_SEED: ${{ matrix.last }}
      - run: npm run test:release -- --faults
        if: matrix.first == 0
        env:
          DOF_SOFTWARE_GL: '1'
          DOF_EVIDENCE_DIR: release-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-browser-evidence-${{ matrix.first }}-${{ matrix.last }}
          path: release-evidence

  verify:
    if: always()
    needs: [build, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful build and every browser shard
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
